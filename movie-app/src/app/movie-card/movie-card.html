<h4>{{movie().title}}</h4>
<p>{{movie().year}}</p>
<p>{{movie().votes}}</p>
<button (click)="upvote()" class="likes" [disabled]="!movie().isWatched">+</button>
<button (click)="remove()" class="delete-btn" >X</button>
@if(movie().isWatched){
  <span>Watched</span>
}@else{
  <span>NotWAtched</span>
}
