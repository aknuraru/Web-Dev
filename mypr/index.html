<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Counter app</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <h1>Counter</h1>
        <div id="currval">0</div>
        <input type="number" id="stepInput" value="1" min="1">
        <div class="buttons">
            <button id="decr">-</button>
            <button id="res">Reset</button>
            <button id="incr">+</button>
        </div>
        <script src="script.js"></script>
    </body>
</html>
